[game]
# Straight in-game baby
lobbyenabled = false
map = "NFDev"
role_timers = false

[ghost]
role_time = 0.5
quick_lottery = true

[gateway]
generator_enabled = false

[movement]
mob_pushing = true

[physics]
# DeepLagoon: on, so a grid cut apart with the RCD becomes two grids (the grid magnet needs this to be testable).
# Set to false if splitting gets in the way while mapping, or use `cvar physics.grid_splitting false` at runtime.
grid_splitting = true

[procgen]
preload = false

[salvage]
expedition_cooldown = 30.0
expedition_failed_cooldown = 10.0

[shuttle]
grid_fill = false
auto_call_time = 0
emergency = false
arrivals = false
preload_grids = false
shipyard = true

[admin]
see_own_notes = true

[mono]
company_whitelist = false
