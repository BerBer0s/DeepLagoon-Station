# Imported from Simple-Station/Einstein-Engines, master archive.
# Numbers for armor here largely taken from /tg/.
# NOTE: Half of the kind of armor you're probably thinking of is in vests.yml. These should probably be merged some day.

#Basic armor vest for inheritance
- type: entity
  parent: [ClothingOuterBaseLarge, AllowSuitStorageClothing]
  id: ClothingOuterArmorCaptainDogi
  name: "shogun's armoured dogi"
  description: "An armored Dogi, made of fine, yet durable fabrics and up armoured\
    \ with exotic alloy to keep it's wearer protected and stylish in combat and in\
    \ duties. Glory to the Shogun!"
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/captaindogi.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Armor/captaindogi.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.6
        Heat: 0.5
        Caustic: 0.9
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  - type: HeldSpeedModifier
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: GroupExamine
