# Imported from Simple-Station/Einstein-Engines, master archive.
- type: entity
  id: ShellShotgunBeanbag
  name: shell (.50 beanbag)
  parent: [BaseShellShotgun, BaseSecurityBartenderContraband]
  components:
  - type: Tag
    tags:
    - Cartridge
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
    - state: beanbag
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: PelletShotgunBeanbag
  - type: SpentAmmoVisuals
    state: "beanbag"
- type: entity
  id: ShellShotgun
  name: shell (.50)
  parent: BaseShellShotgun
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: PelletShotgunSpread
- type: entity
  id: BaseShellShotgun
  name: shell (.50)
  parent: [BaseCartridge, BaseRestrictedContraband]
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - ShellShotgun
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: EmitSoundOnLand
    sound:
      collection: ShellLand
      params:
        volume: -5
  - type: EmitSoundOnCollide
    sound:
      collection: ShellLand
      params:
        volume: -5
- type: entity
  id: ShellShotgunLumen
  name: shell (.50 Lumenblast)
  parent: BaseShellShotgun
  components:
  - type: Tag
    tags:
    - Cartridge
    - ShellShotgun
  - type: Sprite
    layers:
    - state: lumen
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: PelletShotgunLumen
  - type: SpentAmmoVisuals
    state: "lumen"
- type: entity
  id: ShellShotgunIncendiary
  name: shell (.50 incendiary)
  parent: BaseShellShotgun
  components:
  - type: Sprite
    layers:
    - state: incendiary
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: PelletShotgunIncendiarySpread
  - type: SpentAmmoVisuals
    state: "incendiary"
